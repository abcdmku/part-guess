<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>What's That Part?</title>
<style>
  :root { --ink: #111; --paper: #fff; --accent: #ffcc00; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--paper);
    font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* Start and end screens */
  #start, #end { flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center; }
  h1 { font-size: clamp(34px, 10vw, 64px); line-height: 1; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { opacity: .6; font-weight: 500; max-width: 22em; }
  .sets { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { padding: 10px 18px; border-radius: 999px; border: 2px solid #444; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .go { background: var(--accent); color: var(--ink); padding: 16px 48px; border-radius: 999px; font-size: 22px; font-weight: 800; }

  /* Play screen: photo fills the screen */
  #play { background: var(--paper); flex-direction: column; }
  #stage { position: relative; flex: 1; overflow: hidden; }
  #photo { position: absolute; transform-origin: 0 0; will-change: transform;
    transition: transform .7s cubic-bezier(.2,.8,.2,1); user-select: none; -webkit-user-drag: none; }
  #count { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 14px; color: #0008; font-size: 15px; z-index: 2; }
  #quit { position: absolute; top: max(4px, env(safe-area-inset-top)); right: 6px; color: #0008; font-size: 26px; padding: 6px 12px; z-index: 2; }
  #hint { position: absolute; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center;
    color: var(--ink); opacity: .45; font-size: 16px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  #answer { background: var(--ink); padding: 18px 20px max(18px, env(safe-area-inset-bottom)); transform: translateY(100%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1); position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; }
  #play.revealed #answer { transform: none; }
  #play.revealed #hint { display: none; }
  #name { font-size: clamp(26px, 7vw, 40px); font-weight: 800; color: var(--accent); }
  #fact { font-weight: 500; opacity: .85; margin-top: 4px; }
  #next { margin-top: 10px; font-size: 15px; opacity: .5; }
  #end .score { font-size: 20px; opacity: .7; }
</style>
</head>
<body>
<section id="start" class="screen on">
  <h1>What's That <span>Part?</span></h1>
  <p class="sub">A part appears. Guess what it is, then tap to reveal.</p>
  <div class="sets" id="sets"></div>
  <button class="go" id="startBtn">Start</button>
</section>

<section id="play" class="screen">
  <div id="stage">
    <div id="count"></div>
    <button id="quit" aria-label="Back to menu">×</button>
    <img id="photo" alt="">
    <div id="hint">Tap to reveal</div>
  </div>
  <div id="answer">
    <div id="name"></div>
    <div id="fact"></div>
    <div id="next">Tap for the next one</div>
  </div>
</section>

<section id="end" class="screen">
  <h1>All <span>done!</span></h1>
  <p class="score" id="endText"></p>
  <button class="go" id="againBtn">Play again</button>
  <button class="chip" id="menuBtn">Change set</button>
</section>

<script src="items.js"></script>
<script>
// The close-up shows a patch about PATCH of the part's size, zoom clamped to [MINZ, MAXZ].
const PATCH = 0.4, MINZ = 2.2, MAXZ = 7;
const $ = id => document.getElementById(id);
const sets = ['All', ...new Set(ITEMS.map(i => i.set))];
let chosen = 'All', deck = [], pos = 0, revealed = false;

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

function drawSets() {
  $('sets').innerHTML = '';
  for (const s of sets) {
    const n = s === 'All' ? ITEMS.length : ITEMS.filter(i => i.set === s).length;
    const b = document.createElement('button');
    b.className = 'chip' + (s === chosen ? ' on' : '');
    b.textContent = `${s} · ${n}`;
    b.onclick = () => { chosen = s; drawSets(); };
    $('sets').append(b);
  }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  deck = shuffle(ITEMS.filter(i => chosen === 'All' || i.set === chosen));
  pos = 0; show('play'); load();
}

let view = null; // where the current close-up looks: point in image (0..1) and zoom

function layout(animate) {
  const it = deck[pos], photo = $('photo'), st = $('stage').getBoundingClientRect();
  // Once revealed, fit the whole part above the answer panel.
  const sh = st.height - (revealed ? $('answer').offsetHeight : 0);
  const a = it.aspect || 1, k = 0.92 * Math.min(st.width / a, sh);
  const w = a * k, h = k, left = (st.width - w) / 2, top = (sh - h) / 2;
  Object.assign(photo.style, { width: w + 'px', height: h + 'px', left: left + 'px', top: top + 'px' });
  photo.style.transition = animate ? '' : 'none';
  // The whole part is always visible; tapping only reveals the name.
  photo.style.transform = 'none'; return;
  const [bx, by, bw, bh] = (it.box || [0, 0, 100, 100]).map(v => v / 100);
  const z = Math.min(MAXZ, Math.max(MINZ, Math.min(st.width / (PATCH * bw * w), st.height / (PATCH * bh * h))));
  const tx = st.width / 2 - left - z * view.x * w, ty = st.height / 2 - top - z * view.y * h;
  photo.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
}

function load() {
  const it = deck[pos];
  revealed = false;
  $('play').classList.remove('revealed');
  const [bx, by, bw, bh] = (it.box || [0, 0, 100, 100]).map(v => v / 100);
  // A random spot in the middle of the part, so replays show a different patch.
  view = { x: bx + bw * (0.3 + Math.random() * 0.4), y: by + bh * (0.3 + Math.random() * 0.4) };
  const photo = $('photo');
  photo.style.visibility = 'hidden';
  photo.onload = () => { photo.style.visibility = 'visible'; };
  photo.src = it.img;
  if (photo.complete) photo.style.visibility = 'visible';
  layout(false);
  $('count').textContent = `${pos + 1} / ${deck.length}`;
  $('name').textContent = it.name;
  $('fact').textContent = it.fact;
  $('next').textContent = pos + 1 < deck.length ? 'Tap for the next one' : 'Tap to finish';
  const nxt = deck[pos + 1]; if (nxt) new Image().src = nxt.img;
}

function tap() {
  if (!revealed) {
    revealed = true;
    $('play').classList.add('revealed');
    layout(true);
  } else if (++pos < deck.length) load();
  else { $('endText').textContent = `You saw all ${deck.length} ${chosen === 'All' ? 'items' : chosen.toLowerCase()}.`; show('end'); }
}

addEventListener('resize', () => { if ($('play').classList.contains('on')) layout(false); });

$('stage').addEventListener('click', e => { if (e.target.id !== 'quit') tap(); });
$('answer').addEventListener('click', tap);
$('quit').onclick = () => show('start');
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('menuBtn').onclick = () => { drawSets(); show('start'); };
drawSets();
</script>
</body>
</html>
